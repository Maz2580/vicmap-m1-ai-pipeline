name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Only the fast-suite (mocked external calls) is run on CI today.
      # The vicmap-access and integration suites need a configured
      # LGA_CODE + real VicMap reachability, which CI doesn't have.
      - name: Run fast test suite
        run: |
          pytest v2_m1_ai_validator/tests/test_fast_suite.py -v

      - name: Compile-check every Python module
        run: |
          python -m compileall -q app.py config.py utils v2_m1_ai_validator

  audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: surfaces known CVEs in pinned deps but doesn't fail the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict
